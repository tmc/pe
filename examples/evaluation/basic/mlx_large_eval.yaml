description: "Large quality parity eval for mlx-lm vs mlx-go"

prompts:
  - |
    Classify the sentiment of the input text.
    Return exactly one label token from this set:
    positive, neutral, negative

    Input: {{text}}

providers:
  - "mlx-lm:mlx-community/Qwen2.5-0.5B-Instruct-4bit"
  - "mlx-go:mlx-community/Qwen2.5-0.5B-Instruct-4bit"

tests:
  - vars:
      text: "Support resolved my issue quickly and politely."
    assert:
      - type: regex
        value: "(?i)\\bpositive\\b"
  - vars:
      text: "The new update made everything faster and easier."
    assert:
      - type: regex
        value: "(?i)\\bpositive\\b"
  - vars:
      text: "Billing corrected the mistake within an hour."
    assert:
      - type: regex
        value: "(?i)\\bpositive\\b"
  - vars:
      text: "Great documentation, I solved it without help."
    assert:
      - type: regex
        value: "(?i)\\bpositive\\b"
  - vars:
      text: "The migration went smoothly with zero downtime."
    assert:
      - type: regex
        value: "(?i)\\bpositive\\b"
  - vars:
