prompts:
  - "Answer in one short sentence: What is prompt engineering?"
  - "Summarize in five words: {{.topic}}"

providers:
  - id: "mlx-lm:mlx-community/Qwen2.5-0.5B-Instruct-4bit"
    config:
      max_tokens: 64
      temperature: 0.2
  - id: "mlx-go-lm:mlx-community/Qwen2.5-0.5B-Instruct-4bit"
    config:
      max_tokens: 64
      temperature: 0.2
      args:
        - --ignore-chat-template

property_tests:
  - name: "non-empty output"
    property: "all providers should return content"
    generator: "random_question"
    constraint: "response.length > 0"
    iterations: 5

options:
  temperature: 0.2
