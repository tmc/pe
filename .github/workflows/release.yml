name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build artifacts without publishing a release'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check:
    name: Check release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'

      - name: Verify modules
        run: go mod verify

      - name: Test command package
        run: go test ./cmd/pe

  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            suffix: ''
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          # The binary inside each archive is named pe: the CLI refuses to
          # run under a pe-* name because that prefix is reserved for
          # plugin dispatch. Platform names stay on the archives.
          bin="pe${{ matrix.suffix }}"
          go build -trimpath \
            -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME} -X main.Commit=${GITHUB_SHA} -X main.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "$bin" ./cmd/pe
          if [ "${{ matrix.goos }}" = windows ]; then
            zip "pe-${GOOS}-${GOARCH}.zip" "$bin"
            shasum -a 256 "pe-${GOOS}-${GOARCH}.zip" > "pe-${GOOS}-${GOARCH}.zip.sha256"
          else
            tar -czf "pe-${GOOS}-${GOARCH}.tar.gz" "$bin"
            shasum -a 256 "pe-${GOOS}-${GOARCH}.tar.gz" > "pe-${GOOS}-${GOARCH}.tar.gz.sha256"
          fi

      - name: Smoke test packaged binary (native)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          dir=$(mktemp -d)
          tar -xzf "pe-linux-amd64.tar.gz" -C "$dir"
          "$dir/pe" --version
          echo 'smoke ok' | "$dir/pe" run-text -

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pe-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            pe-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            pe-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
            pe-${{ matrix.goos }}-${{ matrix.goarch }}.zip
            pe-${{ matrix.goos }}-${{ matrix.goarch }}.zip.sha256
          if-no-files-found: ignore

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
